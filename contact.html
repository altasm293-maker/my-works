<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي | معرض أعمالي</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container nav">
        <a href="index.html" class="logo">معرض أعمالي</a>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="projects.html">المشاريع</a>
            <a href="contact.html">تواصل معي</a>
        </nav>
    </div>
</header>

<section class="page-heading">
    <div class="container">
        <span>يسعدني تواصلك</span>
        <h1>تواصل معي</h1>
        <p>يمكنك إرسال رسالة من خلال النموذج التالي.</p>
    </div>
</section>

<section class="section">
    <div class="container">

        <div class="contact-box">

            <h2>أرسل رسالة</h2>

            <form id="contactForm">

                <label for="name">الاسم</label>
                <input type="text" id="name" placeholder="اكتب اسمك" required>

                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" required>

                <label for="message">الرسالة</label>
                <textarea id="message" rows="6" placeholder="اكتب رسالتك هنا..." required></textarea>

                <button type="submit" class="btn">إرسال الرسالة</button>

            </form>

        </div>

    </div>
</section>

<footer class="footer">
    <p>جميع الحقوق محفوظة © 2026 | معرض أعمالي</p>
</footer>

<script src="assets/js/main.js"></script>

</body>
</html>
